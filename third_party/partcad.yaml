# Third-party shapes for the parts the reBot DevArm buys rather than makes.
#
# WHY THIS PACKAGE EXISTS
#   Every part of an assembly needs a shape. Not for manufacturing - a part with
#   a 'vendor' and an 'sku' is ordered, not made, and PartCAD asks nothing about
#   how it could be - but for everything else a model is for: seeing the arm,
#   checking that the parts fit, and eventually simulating them. A BOM line with
#   no shape is a hole in the assembly.
#
#   The vendors of these parts publish no CAD model, so the shapes live here.
#
# WHAT THESE SHAPES ARE
#   Envelopes, not models. Each one reproduces the dimensions that matter for
#   fit - the bore and outside diameter of a bearing, the section and length of a
#   rail, the bounding box of an actuator - and nothing else. They are the right
#   thing to check a clearance against and the wrong thing to machine from.
#
#   Every part below says which of its dimensions are from a datasheet or a
#   product listing ("stated") and which are inferred ("approximate"), and a
#   comment on each says what the envelope leaves out. Where a dimension is not known
#   at all the part is not declared: an invented figure is worse than a gap,
#   because nothing downstream can tell it from a measured one.
#
# WHERE A BETTER SHAPE WOULD COME FROM, IN ORDER
#   1. The vendor's own STEP file, declared with 'fileFrom: url' + 'fileHash'.
#      That is the whole of what this package should be, and none of these
#      vendors publish one.
#   2. A public PartCAD package: '//pub/std/metric/bosl2' generates parametric
#      ball bearings, gears and threaded parts from BOSL2, and
#      '//pub/std/metric/cqwarehouse' the ISO fasteners this repository already
#      uses. A part these serve should be enriched from them rather than
#      re-modelled here - see PARTCAD.md for what stopped the bearings and the
#      gear from being declared that way today.
#   3. The released full-arm STEP file, which carries the vendor geometry the
#      designers actually worked against. See PARTCAD.md, "Next steps".
#
# Vendor and SKU come from the product links in the two variant readmes, so an
# Amazon ASIN is the SKU of vendor 'amazon' and a Seeed Studio product page id
# the SKU of 'seeedstudio'. They are what a store provider would order by.

name: //pub/robotics/rebot/devarm/third_party
desc: Envelope shapes for the purchased parts of the reBot DevArm
partcad: ">=0.8.80"

# Nothing here is manufactured: these are other people's products, and this
# package makes no claim that they can be made from what it declares.
manufacturable: false

docs:
  usage: |
    ```shell
    pc --no-ansi list parts //pub/robotics/rebot/devarm/third_party
    pc --no-ansi inspect //pub/robotics/rebot/devarm/third_party:bearing/6803zz
    ```

# Who supplies the parts of this package: the two providers the root package
# declares. 'suppliers:' is not inherited from a parent package, so each package
# whose parts are meant to be bought or made names them for itself.
suppliers:
  //pub/robotics/rebot/devarm:reference-prices:
  //pub/robotics/rebot/devarm:workshop:

parts:
  ##############################################################################
  # Bearings
  #
  # A deep-groove ball bearing as an envelope: the outer ring, the inner ring and
  # the shield between them, with the balls left out. Bore, outside diameter and
  # width are what a housing is cut to, and all three are stated by the product
  # listings the readmes link to.
  ##############################################################################
  # NOTE: each bearing is its own declaration of the same script rather than an
  # 'enrich' of one parametric bearing, which is what this was. A 'vendor' and an
  # 'sku' declared on an enrich (or on an alias) are ignored - only the ones on
  # the part underneath are read - so an enriched bearing was a bearing nothing
  # could order. See PARTCAD.md.
  bearing/6707zz:
    type: step
    path: vendor/bearing-6707zz.step
    desc: 6707ZZ shielded ball bearing, 35x44x5 mm (x1 in the DM arm, joint 1)
    vendor: amazon
    sku: B0D6WBMW3F
    properties:
      material: chrome steel (AISI 52100)
      color: "#9AA3AA"
    # The vendor's own model, out of the released DM assembly: 44.0 across the outer ring, 35.0
    # bore, 5.0 wide, with the shield drawn. Not an envelope, so it is also the frame the
    # release places this bearing in - which is what makes the placement in ../arm.assy exact.

  bearing/6803zz:
    type: step
    path: vendor/bearing-6803zz.step
    desc: 6803ZZ shielded ball bearing, 17x26x5 mm (x3 in both arms)
    vendor: amazon
    sku: B0D54JSWBZ
    properties:
      material: chrome steel (AISI 52100)
      color: "#9AA3AA"
    # The vendor's own model, out of the released DM assembly: 26.0 across, 5.0 wide. The RS
    # release models a different bearing under the same readme row - see 'bearing/f6803zz'.

  bearing/f6803zz:
    type: step
    path: vendor/bearing-f6803zz.step
    desc: F6803ZZ flanged shielded ball bearing, 17x26x5 mm with a 28 mm flange (x2 in the RS arm)
    vendor: amazon
    sku: B0D54JSWBZ
    properties:
      material: chrome steel (AISI 52100)
      color: "#9AA3AA"
    # The vendor's own model, out of the released RS assembly. Both readmes order a "6803ZZ" and the
    # two releases model two different bearings for it: the DM release a plain 26 mm one, this one a
    # flanged 28 mm one, whose volume is a quarter larger. The SKU is the row's own, which is a plain
    # 6803ZZ - so either the RS arm needs a flanged bearing the readme does not order, or its CAD
    # models the wrong part. See ../PARTCAD.md.

  bearing/axk5578:
    type: step
    path: vendor/bearing-axk5578.step
    desc: AXK5578 thrust needle roller bearing, 55x78x3 mm (x1 in both arms)
    vendor: amazon
    sku: B0B3M3RZGW
    properties:
      material: chrome steel (AISI 52100)
      color: "#9AA3AA"
    # The vendor's own model, out of the released DM assembly, and the RS release holds the same
    # solid in the same frame. It is 5.0 mm thick where the AXK5578 designation is 3 mm: the
    # stack is this bearing plus the two AS5578 washers neither readme orders. Drawn 77.7 across
    # rather than the nominal 78.

  ##############################################################################
  # Linear motion
  ##############################################################################
  rail/mgn9-170:
    type: step
    path: vendor/rail-mgn9-170.step
    desc: MGN9 linear rail, 170 mm (x1 in both arms)
    vendor: amazon
    sku: B0D54L45WM
    properties:
      material: stainless steel
      color: "#B8BEC4"
    # The vendor's own model, out of the released DM assembly, and the RS release holds the same
    # solid in the same frame: 9.0 x 6.5 x 170.0, running along its own +Z from the origin. The
    # 6.5 mm height is the model's, not the MGN9 standard's 10 mm - see ../PARTCAD.md. This part
    # is why the envelopes were replaced: placed by the release's transformation, the 170 mm
    # envelope lay along X where the rail belongs along Z, 170 mm out.

  carriage/mgn9c:
    type: step
    path: vendor/carriage-mgn9c.step
    desc: MGN9C carriage block (x2 in both arms)
    vendor: amazon
    sku: B0D9QBQDKB
    properties:
      material: stainless steel
      color: "#B8BEC4"
    # The vendor's own model, out of the released DM assembly, and the RS release holds the same
    # solid in the same frame: 20.0 x 8.0 x 28.9.

  ##############################################################################
  # Actuators
  #
  # The arm's joints: the Damiao pair for the DM variant, the RobStride pair for
  # the RS one. Three of the four are sized from the released full-arm STEP files
  # rather than from a datasheet, because their vendors publish none - see the
  # comment on each, and the table in PARTCAD.md that the measurements come
  # from.
  ##############################################################################
  actuator/dm4310:
    type: extrude
    sketch: circle-57
    depth: 69.466
    desc: Damiao DM4310(V4) actuator (x4 in the DM arm)
    # A cylinder, in the vendor model's own frame. The vendor's own solid is 25 MB
    # and is a cylinder to everything downstream, so what is taken from it is its
    # extent and its frame: 57.0 across, from z = 4.458 to z = 73.924 along its own
    # Z. That frame is the half of it a placement needs - ../arm.assy places these
    # by a transformation read off the same release, and a transformation only means
    # what it says with the frame it was read from.
    offset: [[0, 0, 4.458], [0, 0, 1], 0]
    implements:
      # Not asserted: derived. The release places four of these and four front
      # spacers on them; the spacer's own port was measured off the spacer's own
      # file, so the motor's port is what the two placements leave - and two
      # independent spacers on two different actuators give the same frame to the
      # third decimal. +Z looks out of the motor, along the model's -Z.
      actuator/dm43xx-output:
        output: [[0, 0, 50.5], [1, 0, 0], 180]
    vendor: seeedstudio
    sku: DIP-Servo-Motor-24V-120RPM-Brushless-98-9mm-4P-L56-W56-H46mm-p-6660
    properties:
      material: aluminium alloy
      color: "#4A4A4A"
    # What this envelope leaves out: the side connector, the output boss, the mounting holes. It is
    # 69.5 mm long where the Seeed Studio listing says 46 mm and 57 across where the listing says
    # 56 - TODO(data): one of the two is wrong, and the vendor is the one to ask.


  actuator/dm4340p:
    type: extrude
    sketch: circle-57
    depth: 56.553
    desc: Damiao DM4340P(V4) actuator (x3 in the DM arm, joints 1-3)
    # As the DM4310 above, and drawn along its own Y rather than Z, which is how the
    # released model has it: 57.0 across, from y = -11.008 to y = 45.545. '-90 about
    # X' is what turns the extrusion's +Z into +Y.
    offset: [[0, -11.008, 0], [1, 0, 0], -90]
    implements:
      # Derived the same way as the DM4310's, from two front spacers on two
      # different actuators. The output face is the y = -11 end, and +Z looks out
      # along the model's -Y.
      actuator/dm43xx-output:
        output: [[0, -11, 0], [1, 0, 0], 90]
    vendor: seeedstudio
    sku: DM4340P-Actuator-p-6663
    properties:
      material: aluminium alloy
      color: "#4A4A4A"
    # The vendor publishes no dimensions for this one at all, so the released model is the only
    # source there is. Approximate in everything but its overall size and its frame.


  actuator/rs00:
    type: extrude
    sketch: circle-57
    depth: 52.02
    desc: RobStride RS00 actuator (x4 in the RS arm)
    # 57.0 across, from z = -10.51 to z = 41.51 along its own Z, off the released RS
    # assembly. No port yet: the RS arm has no part with a measured mating face to
    # derive one from, the way the two Damiao actuators have.
    offset: [[0, 0, -10.51], [0, 0, 1], 0]
    vendor: seeedstudio
    sku: Robostride-00-Actuator-p-6664
    properties:
      material: aluminium alloy
      color: "#4A4A4A"
    # RobStride publishes no dimensioned drawing, so the overall size and the frame are all this is
    # right about.


  actuator/rs06:
    type: extrude
    sketch: circle-82
    depth: 50.52
    desc: RobStride RS06 actuator (x3 in the RS arm)
    # 82.0 across, from z = -16.01 to z = 34.51, off the released RS assembly. The
    # three the release places are one product drawn three slightly different ways,
    # between 84.5 and 87.3 mm across; this is the first of them, and the 2.5 mm the
    # box is wider than the cylinder is a protrusion this envelope does not have.
    offset: [[0, 0, -16.01], [0, 0, 1], 0]
    vendor: seeedstudio
    sku: Robostride-06-Actuator-p-6668
    properties:
      material: aluminium alloy
      color: "#4A4A4A"
    # As the RS00: the overall size and the frame, and nothing else.


  ##############################################################################
  # Power
  ##############################################################################
  psu/lrs-350-24:
    type: build123d
    path: src/psu_enclosed.py
    desc: MeanWell LRS-350-24 power supply, 24V 14.6A (x1, DM arm)
    parameters:
      length: 215.0
      width: 115.0
      height: 30.0
    vendor: amazon
    sku: B013ETVO12
    properties:
      material: galvanized steel
      color: "#C9CDD1"
    # What this envelope is, and what it leaves out:
    # The 215 x 115 x 30 mm case of the LRS-350 series, stated by the MeanWell datasheet, with the
    # mounting flanges it is screwed down by. The terminal block, the ventilation slots and the
    # adjustment trimmer are left out, and the flange hole positions are approximate.

  psu/lrs-600-48:
    type: build123d
    path: src/psu_enclosed.py
    desc: MeanWell LRS-600-48 power supply, 48V 12.5A (x1, RS arm)
    parameters:
      length: 215.0
      width: 115.0
      height: 30.0
    vendor: amazon
    sku: B0BV5XFYNS
    properties:
      material: galvanized steel
      color: "#C9CDD1"
    # What this envelope is, and what it leaves out:
    # The same 215 x 115 x 30 mm case as the LRS-350 above: the LRS-600 shares the case of the
    # LRS-350 in the MeanWell datasheet. Same envelope, same omissions.

  ##############################################################################
  # Connectors and cables
  #
  # A cable is not one shape. It is two connectors and a length of wire whose
  # path is decided when the arm is assembled, which is an assembly rather than a
  # part - see ./cable-xt30-2x2.assy, where the wire is a 'sweep' along the route
  # it takes and the connectors are these parts.
  ##############################################################################
  connector/xt30-2x2-plug:
    type: step
    path: vendor/connector-xt30-2x2.step
    desc: XT30 2+2 connector housing, one end of a motor harness
    properties:
      material: nylon
      color: "#F2C230"
    # The vendor's own model, out of the released RS assembly, which places twelve of these on
    # the motors. It is the connector body; the wire is not part of it.

  connector/xt30-2x2-socket:
    type: step
    path: vendor/connector-xt30-2x2-socket.step
    desc: XT30 2+2 panel socket, the base end of a motor harness (x2 in the RS arm)
    properties:
      material: nylon
      color: "#1A1A1A"
    # The vendor's own model, out of the released RS assembly. The RS release models the two ends of
    # a harness as two different parts, which is what they are; neither readme gives the socket a row
    # of its own, so it carries no vendor or SKU.

  connector/xt60e-female:
    type: build123d
    path: src/connector_xt60e.py
    desc: XT60E-F panel-mount connector with lug pigtail (x1 in both arms)
    vendor: amazon
    sku: B0CQK1P1DP
    properties:
      material: nylon
      color: "#F2C230"
    # What this envelope is, and what it leaves out:
    # The XT60E-F panel body as a 16 x 8 mm plate with the two 3.5 mm bullets behind it and the two
    # M3 mounting holes the readme's assembly step 1-3 screws through. Approximate in depth; the
    # pigtail is not part of the shape.

  wire/silicone-14awg:
    type: build123d
    path: src/wire_round.py
    desc: A length of 14 AWG silicone wire
    parameters:
      length: 100.0
      diameter: 3.5
    properties:
      material: silicone
      color: "#1A1A1A"
    # What this envelope is, and what it leaves out:
    # A round 3.5 mm section - 14 AWG conductor plus silicone insulation - run straight for the
    # given length. It is the shape of a wire in its bag, not of an installed one: the route an
    # installed wire takes belongs to the assembly that routes it, and a swept path replaces this
    # cylinder as soon as there is a route to sweep along (see ./cable-xt30-2x2.assy).

  ##############################################################################
  # Miscellaneous
  ##############################################################################
  pad/silicone-30x9x2:
    type: step
    path: vendor/pad-silicone-30x9x2.step
    desc: Self-adhesive silicone pad, 30 x 9 x 2 mm (x1 in both arms)
    vendor: amazon
    sku: B0F9KVYXFZ
    properties:
      material: silicone
      color: "#2E2E2E"
    # The vendor's own model, out of the released DM assembly, and the RS release holds the same
    # solid in the same frame. Drawn at an angle in its own frame rather than as a box on an
    # axis, which is why the box around it is not 30 x 9 x 2.

  ##############################################################################
  # The fasteners, as the releases model them
  #
  # These were an 'enrich' of //pub/std/metric/cqwarehouse each, which is the right
  # way to declare an ISO fastener and the wrong way to place one here. 160 of the
  # DM arm's 326 components and 111 of the RS arm's are screws, and every one of
  # their placements is read off a release that placed *its* model: a generated ISO
  # screw put there instead lands origin-on-origin, pointing the wrong way, its head
  # somewhere else. So the geometry is the release's, and the standard each one is
  # ordered against stays in its description and its SKU.
  #
  # All of them are drawn head at the origin running along their own +Y, which is
  # why one file serves both arms for a screw both arms use. Where the two releases
  # each model the same screw, the DM release's is the one taken: they differ by
  # under three percent by volume, which is two models of one product rather than
  # two products.
  #
  # The four countersunk M3 rows of both readmes link one product, an assortment,
  # so all four carry that SKU. It is the readme's own answer rather than a checked
  # one; see ../PARTCAD.md's data questions.
  #
  # Two of the names the releases use are not the size of the thing:
  # 'HM3-26' measures 27.90 overall against a 2.90 head, so it is the M3x25 the
  # readme orders and not an M3x26; 'KM3-8-XIAO' measures 7.00 overall, so it is not
  # 8 mm long either. Both are declared at what they measure.
  ##############################################################################
  screw/hm3x6:
    type: step
    path: vendor/screw-hm3x6.step
    desc: M3x6 hex socket head cap screw (x8 in the DM arm, x8+ in the RS arm)
    vendor: amazon
    sku: B0DJQG5YLF
    count_per_sku: 120
    properties:
      material: stainless steel
      color: "#C0C0C0"

  screw/hm3x8:
    type: step
    path: vendor/screw-hm3x8.step
    desc: M3x8 hex socket head cap screw (x45 in the RS arm)
    vendor: amazon
    sku: B0DJQG5YLF
    count_per_sku: 120
    properties:
      material: stainless steel
      color: "#C0C0C0"

  screw/hm3x12:
    type: step
    path: vendor/screw-hm3x12.step
    desc: M3x12 hex socket head cap screw (x7 in the DM arm)
    vendor: amazon
    sku: B0DJQGMQZM
    count_per_sku: 120
    properties:
      material: stainless steel
      color: "#C0C0C0"

  screw/hm3x25:
    type: step
    path: vendor/screw-hm3x25.step
    desc: M3x25 hex socket head cap screw (x6 in the DM arm) - the release calls it HM3-26
    vendor: amazon
    sku: B0DJQFGRPQ
    count_per_sku: 120
    properties:
      material: stainless steel
      color: "#C0C0C0"

  screw/hm3x30:
    type: step
    path: vendor/screw-hm3x30.step
    desc: M3x30 hex socket head cap screw (x8 in the RS arm)
    vendor: amazon
    sku: B0DJQFGRPQ
    count_per_sku: 120
    properties:
      material: stainless steel
      color: "#C0C0C0"

  screw/hm4x8:
    type: step
    path: vendor/screw-hm4x8.step
    desc: M4x8 hex socket head cap screw (x6 in the RS arm) - README.md calls it a set screw
    vendor: amazon
    sku: B0DR1NX178
    properties:
      material: stainless steel
      color: "#C0C0C0"

  screw/hm4x16:
    type: step
    path: vendor/screw-hm4x16.step
    desc: M4x16 hex socket head cap screw (x18 in the RS arm) - README.md calls it a set screw
    vendor: amazon
    sku: B0DR1NX178
    properties:
      material: stainless steel
      color: "#C0C0C0"

  screw/hm4x70:
    type: step
    path: vendor/screw-hm4x70.step
    desc: M4x70 hex socket head cap screw (x4 in the RS arm) - README.md calls it a set screw
    vendor: amazon
    sku: B0DR1NX178
    properties:
      material: stainless steel
      color: "#C0C0C0"

  screw/hm4x75:
    type: step
    path: vendor/screw-hm4x75.step
    desc: M4x75 hex socket head cap screw (x4 in the DM arm) - README.md calls it a set screw
    vendor: amazon
    sku: B0DR1NX178
    properties:
      material: stainless steel
      color: "#C0C0C0"

  screw/km3x7:
    type: step
    path: vendor/screw-km3x7.step
    desc: M3x7 countersunk head screw (x64 in the DM arm, x58 in the RS arm)
    vendor: amazon
    sku: B01E6EIC2S
    properties:
      material: stainless steel
      color: "#C0C0C0"

  screw/km3x8-micro:
    type: step
    path: vendor/screw-km3x8-micro.step
    desc: M3 micro-profile countersunk screw, 7 mm long (x5 in the DM arm) - README.md calls it KM3x8
    vendor: amazon
    sku: B01MS60KSY
    properties:
      material: stainless steel
      color: "#C0C0C0"

  screw/km3x9:
    type: step
    path: vendor/screw-km3x9.step
    desc: M3x9 countersunk head screw (x34 in the DM arm; README.md orders 31+, which is three short)
    vendor: amazon
    sku: B01E6EIC2S
    properties:
      material: stainless steel
      color: "#C0C0C0"

  screw/km3x12:
    type: step
    path: vendor/screw-km3x12.step
    desc: M3x12 countersunk head screw (x22 in the DM arm)
    vendor: amazon
    sku: B01E6EIC2S
    properties:
      material: stainless steel
      color: "#C0C0C0"

  screw/km3x16:
    type: step
    path: vendor/screw-km3x16.step
    desc: M3x16 countersunk head screw (x26 in the DM arm)
    vendor: amazon
    sku: B01E6EIC2S
    properties:
      material: stainless steel
      color: "#C0C0C0"

  ##############################################################################
  # Not envelopes: the vendor's own geometry, out of the released assembly
  #
  # Every part above is an envelope this repository drew from a datasheet. These
  # are not. They are the solids the designers worked against, taken out of
  # hardware/reBot_B601_DM/reBot_B601_DM_v1.1_20260425.step by
  # ../tools/extract_vendor_parts.py - one file per part, in the part's own
  # coordinates - and each is exact to whatever the vendor or the designer modelled.
  #
  # This is the third source that this package's header lists, and for these seven
  # it is the only one. Nobody publishes CAD for a KA3x12 self-tapping screw or a
  # 4 mm dowel pin, '//pub/std/metric/cqwarehouse' has no self-tapping or
  # set-screw profile, and the gear is the part PARTCAD.md records BOSL2 could not
  # generate here. Until they existed, none of them was in any assembly or any
  # bill of materials: 80 of the DM arm's 326 components and 49 of the RS arm's
  # 263 were parts with no shape to place.
  #
  # Re-run the extractor when a release changes; do not edit the .step files.
  ##############################################################################
  gear/m1-16t-b6:
    type: step
    path: vendor/gear-m1-16t-b6.step
    desc: Module 1 spur gear, 16 teeth, 6 mm bore, boss type (x1 in both arms)
    vendor: amazon
    sku: B0GDSR1LKM
    # The extracted solid is 17.888 mm across the tips and 18.0 mm tall, which is
    # a module 1, 16 tooth gear (pitch circle 16, tip circle 18 less a tip
    # relief) with a boss. The readme's product link resolves to a listing whose
    # slug says 15 teeth; the CAD is 16, and the readme's own specification says
    # 16. Ordering off that link is a thing to check - see ../PARTCAD.md.
    properties:
      material: steel
      color: "#8A8A8A"

  screw/ka3x12:
    type: step
    path: vendor/screw-ka3x12.step
    desc: KA3x12 Phillips pan head self-tapping screw (x60 in the DM arm, x34 in the RS arm)
    vendor: amazon
    sku: B01MXSS95N
    count_per_sku: 100
    # The most-used fastener in either arm and the one with no ISO profile to
    # enrich from: a 6 mm head, 12 mm long, tapping its own thread into a printed
    # or cast boss.
    properties:
      material: steel
      color: "#C0C0C0"

  screw/m4x5-set:
    type: step
    path: vendor/screw-m4x5-set.step
    desc: M4x5 hex socket set screw (x2 in the DM arm)
    # The released model calls it "S-M4-5-JIMI" and the readmes list no such
    # line, so there is no product link for it. 4.0 mm across and 5.0 mm long
    # with a socket and no head, which is a grub screw.
    properties:
      material: steel
      color: "#4A4A4A"

  # The dowel pins. The released assembly holds four sizes; the DM readme lists
  # two ("M4*8mm" and "M4*12mm", quantity "Several"), and neither is one of them.
  # The lengths below are the CAD's, measured off the extracted solids, because
  # that is what has to fit the holes. One dowel-pin listing covers the three 4 mm
  # sizes - it is the one the readme points at for both of its - and the 3 mm pin
  # has no listing at all.
  pin/d3x8:
    type: step
    path: vendor/pin-d3x8.step
    desc: 3 x 8 mm dowel pin (x2 in the DM arm)
    properties:
      material: stainless-steel
      color: "#B8BCC0"

  pin/d4x7:
    type: step
    path: vendor/pin-d4x7.step
    desc: 4 x 7 mm dowel pin (x6 in the DM arm)
    vendor: amazon
    sku: B0F6CWL4MP
    properties:
      material: stainless-steel
      color: "#B8BCC0"

  pin/d4x10:
    type: step
    path: vendor/pin-d4x10.step
    desc: 4 x 10 mm dowel pin (x6 in the DM arm)
    vendor: amazon
    sku: B0F6CWL4MP
    properties:
      material: stainless-steel
      color: "#B8BCC0"

  pin/d4x14:
    type: step
    path: vendor/pin-d4x14.step
    desc: 4 x 14 mm dowel pin (x3 in the DM arm)
    vendor: amazon
    sku: B0F6CWL4MP
    properties:
      material: stainless-steel
      color: "#B8BCC0"

##############################################################################
# How a Damiao DM43xx actuator is bolted to
#
# Measured, not assumed. Two of the DM arm's machined parts carry the same
# pattern - 02_Motor_Front_Spacer.step and 02_FLANGE.step - and reading their
# cylindrical faces gives it exactly: six holes of radius 1.6 (front spacer) and
# 1.35 (flange) on a circle of radius 13.5 at 60 degree spacing, around a bore of
# radius 7. A 27 mm bolt circle fits inside the 30 mm output boss the envelope
# already declared, which is the cross-check that this is the motor's face and
# not something else.
#
# One port at the centre of the pattern rather than six, one per hole. What a
# bolt circle fixes is the axis and the roll, and the roll of six holes at 60
# degrees is any multiple of 60 - so the centre and the axis are the joint, and
# six ports would offer PartCAD a choice of which hole meets which, which is not
# a choice anybody wants made for them. Six ports is what to write the day a
# fastener has to be placed in one named hole.
#
# 'Z points out of the object it belongs to' is PartCAD's convention: the
# direction a part travels along when it is connected through that port. So the
# motor's port looks away from the motor, and the port on whatever bolts to it
# looks into that part - and mating them lands the two faces together.
##############################################################################
interfaces:
  actuator/dm43xx-output:
    desc: >-
      The output face of a Damiao DM43xx actuator: six M3 threads on a 27 mm bolt
      circle around a 14 mm boss. Z points out of the motor.
    ports:
      face:
        sketch: dm43xx-bolt-circle
    mates:
      actuator/dm43xx-mounted:

  actuator/dm43xx-mounted:
    desc: >-
      The face of a part that bolts to a DM43xx output: the same six holes on the
      same circle. Z points into the part.
    ports:
      face:
        sketch: dm43xx-bolt-circle

sketches:
  # The bolt circle, so that a port drawn on a render is the size of the thing it
  # names rather than a bare set of arrows.
  dm43xx-bolt-circle:
    type: basic
    circle: 13.5

  # The actuator envelopes' sections, as the released models measure them.
  circle-57:
    type: basic
    circle: 28.5

  circle-82:
    type: basic
    circle: 41.0

assemblies:
  cable/xt30-2x2-350:
    type: assy
    path: cable-xt30-2x2.assy
    desc: XT30 2+2 motor harness, 350 mm, both ends angled (x2 in the DM arm)
    parameters:
      length: 350.0
    manufacturable: false

# Every part of the reBot Arm B601 DM (Damiao DM43xx actuators).
#
# This file is the source of truth for the arm's parts list; ./README.md is
# generated from it, and so are ./arm.md and ./power-supply.md.
#
# A name here is a name, and nothing else. What makes a part is its
# 'manufacturing:' section, what it costs is its 'vendor:' and 'sku:', and
# neither belongs in front of its name - so there are no 'printed/' or 'cnc/'
# prefixes to keep in step with the declarations underneath them. The one place a
# name says what a thing is for is '<part>-blank': the piece of plate a machined
# part is cut from, which exists because 'method: subtractive' means "what is
# left of something that existed first" and PartCAD asks what that was.
#
# Quantities are NOT stored here: in PartCAD a part is declared once and the
# quantity comes from how many times an assembly places it. See ./arm.assy and
# ./power-supply.assy. Until those assemblies carry real placements, the per-part
# 'desc' keeps the readme quantity in the "(xN)" suffix so that no data is lost.

desc: reBot Arm B601 DM - Damiao DM43xx actuators
url: https://github.com/clairbee/rebot-devarm/tree/main/hardware/reBot_B601_DM
manufacturable: true

# What ./README.md says above the generated parts list. The folder is a PartCAD
# package - it holds the parts and the assemblies - so its readme is generated
# from this file rather than hand-maintained beside it, and everything the
# vendor's document said that is not a parts list is here.
#
# 'docs.intro' takes at most 5000 characters, which is why the two longest
# sections of the old document are documents of their own under ./doc/ and linked
# from here: what to buy and what it costs, and how the power supply goes
# together.

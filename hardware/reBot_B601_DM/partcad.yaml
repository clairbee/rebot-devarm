  ##############################################################################
  # Purchased parts - fasteners
  #
  # Modelled by enriching the parametric cq-warehouse parts from the public
  # PartCAD index, so that they carry real geometry and can be mated later.
  #
  # README.md names them in the vendor's shorthand:
  #   HM<d>-<l>  hex socket head cap screw  -> ISO 4762
  #   KM<d>*<l>  countersunk head screw     -> ISO 10642 (hex socket)
  #   KA<d>*<l>  self-tapping screw         -> no standard part available yet
  #
  # TODO(data): confirm the drive type of the KM* screws. README.md says "standard
  # hex socket screws have been selected" but links a Phillips countersunk product;
  # ISO 10642 (hex socket) is assumed here, ISO 7046 would be the Phillips one.
  ##############################################################################
  screw-hm3-6:
    type: alias
    source: //pub/robotics/rebot/devarm/third_party:screw/hm3x6
    desc: M3x6 hex socket head cap screw (x16+)

  screw-hm3-12:
    type: alias
    source: //pub/robotics/rebot/devarm/third_party:screw/hm3x12
    desc: M3x12 hex socket head cap screw (x14+)

  screw-hm3-25:
    type: alias
    source: //pub/robotics/rebot/devarm/third_party:screw/hm3x25
    desc: M3x25 hex socket head cap screw (x14+)

  screw-hm4-75:
    type: alias
    source: //pub/robotics/rebot/devarm/third_party:screw/hm4x75
    desc: M4x75 hex socket head screw (x4+) - README.md calls it a set screw

  screw-km3-7:
    type: alias
    source: //pub/robotics/rebot/devarm/third_party:screw/km3x7
    desc: M3x7 countersunk head screw (x76+)

  screw-km3-8:
    type: alias
    source: //pub/robotics/rebot/devarm/third_party:screw/km3x8-micro
    desc: M3x8 socket micro profile head screw (x31+)

  screw-km3-9:
    type: alias
    source: //pub/robotics/rebot/devarm/third_party:screw/km3x9
    desc: M3x9 countersunk head screw (x31+)

  screw-km3-12:
    type: alias
    source: //pub/robotics/rebot/devarm/third_party:screw/km3x12
    desc: M3x12 countersunk head screw (x30+)

  screw-km3-16:
    type: alias
    source: //pub/robotics/rebot/devarm/third_party:screw/km3x16
    desc: M3x16 countersunk head screw (x34+)

  # Power supply enclosure fasteners (README.md, "Consumables BOM")
  screw-m4x6-countersunk:
    type: enrich
    source: //pub/std/metric/cqwarehouse:fastener/countersunk-iso7046
    desc: M4x6 304 stainless steel Phillips countersunk head screw (x6)
    with:
      size: M4-0.7
      length: 6

  screw-m3x8-countersunk:
    type: enrich
    source: //pub/std/metric/cqwarehouse:fastener/countersunk-iso7046
    desc: M3x8 304 stainless steel Phillips countersunk head screw (x2)
    with:
      size: M3-0.5
      length: 8

  screw-m3x8-pan:
    type: enrich
    # ISO 7045 is the Phillips pan head standard; cq-warehouse names it
    # "raised cheese head".
    source: //pub/std/metric/cqwarehouse:fastener/raisedcheesehead-iso7045
    desc: M3x8 304 stainless steel Phillips pan head screw (x2)
    with:
      size: M3-0.5
      length: 8

  ##############################################################################
  # Purchased parts - the vendor publishes no CAD model
  #
  # Their shapes live in //pub/robotics/rebot/devarm/third_party, which is this
  # repository's own package of envelopes for other people's products; the
  # aliases below are what puts them in this variant's BOM under the names the
  # readme uses. Each envelope says in its 'summary' what it is and is not - read
  # that before trusting one for anything but a clearance.
  ##############################################################################
  # NOTE: no 'vendor'/'sku' here. An alias reads them from the part it points at,
  # which is where they are declared; declaring them on the alias itself has no
  # effect at all (a PartCAD bug - see PARTCAD.md), so writing them twice would
  # only be a second copy to keep in step.
  actuator-dm4310:
    type: alias
    source: //pub/robotics/rebot/devarm/third_party:actuator/dm4310
    desc: Brushless actuator DM4310(V4) (x4, joints 4-7)

  actuator-dm4340p:
    type: alias
    source: //pub/robotics/rebot/devarm/third_party:actuator/dm4340p
    desc: Brushless actuator DM4340P(V4) (x3, joints 1-3)

  bearing-6707zz:
    type: alias
    source: //pub/robotics/rebot/devarm/third_party:bearing/6707zz
    desc: Bearing 6707ZZ (x1, joint 1)

  bearing-6803zz:
    type: alias
    source: //pub/robotics/rebot/devarm/third_party:bearing/6803zz
    desc: Bearing 6803ZZ (x3)

  bearing-axk5578:
    type: alias
    source: //pub/robotics/rebot/devarm/third_party:bearing/axk5578
    desc: Thrust bearing AXK5578 (x1, joint 1)

  rail-mgn9-170:
    type: alias
    source: //pub/robotics/rebot/devarm/third_party:rail/mgn9-170
    desc: Linear rail MGN9-170mm (x1, gripper)

  carriage-mgn9:
    type: alias
    source: //pub/robotics/rebot/devarm/third_party:carriage/mgn9c
    desc: Slider block MGN9 (x2, gripper)

  pad-silicone:
    type: alias
    source: //pub/robotics/rebot/devarm/third_party:pad/silicone-30x9x2
    desc: Silicone pad 30x9x2mm (x1)

  psu-lrs-350-24:
    type: alias
    source: //pub/robotics/rebot/devarm/third_party:psu/lrs-350-24
    desc: Power supply MeanWell LRS-350-24, 24V 14.6A (x1)

  connector-xt60e:
    type: alias
    source: //pub/robotics/rebot/devarm/third_party:connector/xt60e-female
    desc: Output port XT60E female + lug pigtail (x1)

  # The parts the released assembly holds that nobody publishes a model of, taken
  # out of that assembly itself rather than approximated - see
  # ../../third_party/partcad.yaml, "Not envelopes". Between them they are 80 of
  # this arm's 326 components: before they existed, arm.assy could place 246.
  #
  # The counts here are the released CAD's, which is the first time this package
  # has had any: the readme gives one arm-wide minimum per fastener ("KA3*12mm,
  # 72+"), and 72+ is not a number a joint's worth of screws can be ordered from.
  screw-ka3-12:
    type: alias
    source: //pub/robotics/rebot/devarm/third_party:screw/ka3x12
    desc: KA3x12 self-tapping screw (x60; README.md says 72+)

  screw-m4x5-set:
    type: alias
    source: //pub/robotics/rebot/devarm/third_party:screw/m4x5-set
    desc: M4x5 set screw (x2); the released CAD calls it S-M4-5-JIMI and README.md does not list it

  gear-m1-16t:

# What the shop cuts these plates on, once, for every part that declares a
# 'cam:' section of its own. The numbers are a 3-axis router in 5052 aluminium
# with flood coolant: conservative feeds, a shallow pass, and climb milling for
# the edge finish the readme's anodized parts need. A part that needs something
# else says so for itself.
#
# 'pc cam' writes the route of every such part; 'pc test' runs the same code as
# its 'cam' check and fails a part whose section cannot produce one. That is what
# makes the "subtractive" method above a claim somebody checked rather than a
# label: a tool that will not fit the inside corners of a part is a route that
# does not come out.



# A projection of every object, next to the package. The generated bills of
# materials show each line's picture from these, which is the column a reader of
# a parts list looks at first; SVG so that a diff is a diff and the files stay
# small.
render:
  svg:
    prefix: doc/

  # The package document: README.md, and not configurably so. 'path:' under a
  # 'render:' file type is the path of an *implementation* of that file type, not
  # the output name - setting it to 'readme.md' made PartCAD try to run this
  # folder's readme as the readme renderer, which fails on the first part number
  # in it ("leading zeros in decimal integer literals are not permitted"). So this
  # folder's readme was renamed from readme.md to README.md, which is the name
  # PartCAD writes. See ../../PARTCAD.md.
  readme:

cam:
  gcode:
    feed: 900 mm/min
    plunge: 250 mm/min
    depth_per_pass: 0.8 mm
    safe_z: 5 mm
    speed: 12000 rpm
    direction: climb

assemblies:
  # Not a part of the arm: the check that the motor mounting interface is where
  # the holes are. See ./check-motor-mount.assy.
  check/motor-mount:
    type: assy
    path: check-motor-mount.assy
    desc: Two parts mated to a DM4340P output face, to prove the interface
    manufacturable: false

  # There is no shared 'gripper/slide' sub-assembly, and the released assemblies
  # are why. Both arms grip with the same parts - the racks, the slider bracket,
  # the two extensions, the gear connector, the rail, its two carriages and the
  # gear are one part each, declared here and aliased into the RS package - but
  # the two releases do not place them to the same numbers. Measured from the
  # slider bracket, the two agree on every one of these parts in X and differ in
  # Z: the carriages are at +/-14.3 mm here and +/-14.8 in the RS release, the
  # racks at +/-4.175 and +/-4.125, the extensions at +/-0.119 and +/-0.069. One
  # sub-assembly with one set of placements would therefore be wrong for one of
  # the two arms, so each arm has its own gripper over one set of parts. The two
  # groups are not the same set of parts either - the RS release puts that arm's
  # wrist motor in its gripper, and this one keeps it in link 6. See
  # ../../PARTCAD.md.
  gripper:
    type: assy
    path: gripper.assy
    desc: The B601 DM gripper as the released assembly holds it (49 components)
    manufacturable: true
    render:
      readme:

  power-supply:
    type: assy
    desc: Power supply enclosure, assembled per README.md "Power Supply Assembly"
    manufacturable: true
    # The bill of materials as markdown, so a change to it is a diff.
    render:
      readme:

  arm:
    type: assy
    desc: reBot Arm B601 DM (structure only so far - see PARTCAD.md)
    manufacturable: true
    # The bill of materials as markdown, so a change to it is a diff.
    render:
      readme:

  # There is no 'reference/arm' object any more, and the released STEP file it
  # declared is read by ../../tools/assy_from_reference.py instead.
  #
  # PartCAD cannot read reBot_B601_DM_v1.1_20260425.step usefully. As
  # 'type: step' it flattens to solids named '<component>_solid<n>', which is why
  # the placements were never recovered from it that way - and it does not finish:
  # 'pc render' of that object decomposes 296 of the file's 326 components into
  # temporary STEP files and then stalls, on the same component every time, with
  # the daemon idle and nothing said. See ../../PARTCAD.md.
  #
  # The generator reads the same file through OpenCASCADE's XCAF layer in about a
  # minute, with every name and every transformation intact, which is where both
  # this package's assemblies come from.

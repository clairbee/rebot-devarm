# Bill of materials of the reBot Arm B601 DM (Damiao DM43xx actuators).
#
# Every entry below is one line of the BOM tables in ./readme.md. The readme
# stays the human-facing document; this file is the machine-readable source of
# truth that 'pc' reads to list, render, quote and (eventually) order the parts.
#
# Naming convention:
#   printed/*    - parts the user 3D prints  (readme: "3D Printed Parts")
#   cnc/*        - parts the user has machined (readme: "CNC Machined Metal Parts")
#   purchased/*  - catalog parts the user buys (readme: "Purchased Parts")
#   accessory/*  - optional add-ons that are not part of the base arm
#
# Quantities are NOT stored here: in PartCAD a part is declared once and the
# quantity comes from how many times an assembly places it. See ./arm.assy and
# ./power-supply.assy. Until those assemblies are complete, the per-part 'desc'
# carries the readme quantity in the "(xN)" suffix so that no data is lost.

desc: reBot Arm B601 DM - Damiao DM43xx actuators
url: https://github.com/clairbee/rebot-devarm/tree/main/hardware/reBot_B601_DM
manufacturable: true

docs:
  intro: |
    Open source v1.1 of the B601 DM arm. The published BOM is the
    minimal-cost reproduction of the design, not the Seeed shipping
    configuration (see the declaration in readme.md).
  usage: |
    ```shell
    pc --no-ansi list parts
    pc --no-ansi inspect power-supply
    ```


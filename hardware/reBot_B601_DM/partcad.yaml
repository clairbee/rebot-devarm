    desc: M3x8 socket micro profile head screw (x31+)
    with:
      size: M3-0.5
      length: 8

  purchased/screw-km3-9:
    type: enrich
    source: //pub/std/metric/cqwarehouse:fastener/countersunk-iso10642
    desc: M3x9 countersunk head screw (x31+)
    with:
      size: M3-0.5
      length: 9

  purchased/screw-km3-12:

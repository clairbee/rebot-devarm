assemblies:
  power-supply:
    type: assy
    desc: Power supply enclosure, assembled per readme.md "Power Supply Assembly"
    manufacturable: true

  arm:
    type: assy
    desc: reBot Arm B601 DM (structure only so far - see PARTCAD.md)
    manufacturable: true

  # The released full-arm STEP file, read as an assembly: PartCAD takes the
  # component tree out of the file, names a part after each component and
  # recognizes the components that are the same geometry, so this is where the
  # real placements and the geometry-derived quantities come from. It is the
  # reference ./arm.assy is being built against, not a replacement for it: the
  # ASSY is what says how the arm goes together, which a STEP file cannot.
  reference/arm-v1.1:
    type: step
    path: reBot_B601_DM_v1.1_20260425.step
    desc: Full arm assembly as released on 2026-04-25 (reference)
    # Not manufacturable: it is somebody else's export, not a thing this package
    # claims can be built from what it declares.
    manufacturable: false

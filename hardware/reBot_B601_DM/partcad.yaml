  ##############################################################################
  # CNC machined metal parts
  #
  # Machining specification (README.md): key dimension tolerance +/-0.02 mm
  # (GB/T1840-M), anodized or sandblasted finish, H7 / interference fit on
  # mating features.
  #
  # 'material' names a catalogued material like the printed parts above do. The
  # alloys are catalogued in ../../partcad.yaml, because
  # //pub/std/manufacturing/material publishes plastics only - a metals
  # catalogue there is what would let this package stop keeping its own (see
  # PARTCAD.md).
  #
  # The tolerance is the 'tolerance:' field, which a 'step' part takes, and the
  # finish and the fit are 'manufacturing.parameters' - what the manufacturer is
  # asked for that the geometry does not carry. All three are columns of the
  # generated bills of materials, and 'pc test' holds the tolerance to being
  # declared.
  #
  # A NOTE ON "CNC + SHEET METAL"
  #   The readme says links 1, 2, 3 and 5 are machined *and* formed, and one
  #   'manufacturing.method' says one of those. That is not the limitation it
  #   looks like: a method describes one step, which turns an input part into an
  #   output part, and a part made two ways is two declarations - the machined
  #   blank, and the formed part the blank is the input to. The blank is a part
  #   for stock-keeping and never appears in the assembly.
  #
  #   What is missing here is the blank's geometry: unfolding the released part
  #   is a CAM operation this repository cannot do, and the vendor publishes only
  #   the finished shape. So each of these four is declared once, as the
  #   'subtractive' step, with the forming step left for when there is a blank to
  #   point at. See PARTCAD.md, "Next steps".
  ##############################################################################

  base-reinforcement-blank:
    type: build123d
    path: src/stock_plate.py
    desc: The 5052 plate base-reinforcement is cut from
    # Not something this package asks anybody to supply: it is the piece the
    # part above is cut out of, declared so that the cut can be checked. What
    # a shop actually buys is a sheet with several of these nested on it.
    manufacturable: false
    parameters:
      step:
        type: string
        default: Metal_Parts/02_Base_Reinforcement_Part.step
      margin: 5.0
    properties:
      material: //pub/robotics/rebot/devarm:aluminium-5052

  base-reinforcement:
    type: step
    path: Metal_Parts/02_Base_Reinforcement_Part.step
    desc: Motor 1 bearing mount (x1) - can be printed in ABS at high infill to save cost
    manufacturing:
      method: subtractive
      source: base-reinforcement-blank
      cnc:
        operation: profile
        diameter: 2 mm
        toolAxis: +Z
      desc: Anodized or sandblasted, H7 or interference fit on mating features
    tolerance: 0.02
    properties:
      material: //pub/robotics/rebot/devarm:aluminium-5052

  arm-yaw-limit-blank:
    type: build123d
    path: src/stock_plate.py
    desc: The 5052 plate arm-yaw-limit is cut from
    # Not something this package asks anybody to supply: it is the piece the
    # part above is cut out of, declared so that the cut can be checked. What
    # a shop actually buys is a sheet with several of these nested on it.
    manufacturable: false
    parameters:
      step:
        type: string
        default: Metal_Parts/02_Arm_Yaw_Limit.step
      margin: 5.0
    properties:
      material: //pub/robotics/rebot/devarm:aluminium-5052

  arm-yaw-limit:
    type: step
    path: Metal_Parts/02_Arm_Yaw_Limit.step
    desc: Motor 1 rotation axis, yaw angle motion limit (x1)
    manufacturing:
      method: subtractive
      source: arm-yaw-limit-blank
      cnc:
        operation: profile
        diameter: 2 mm
        toolAxis: -Z
      desc: Anodized or sandblasted, H7 or interference fit on mating features
    tolerance: 0.02
    properties:
      material: //pub/robotics/rebot/devarm:aluminium-5052

  motor-front-spacer-blank:
    type: build123d
    path: src/stock_plate.py
    desc: The 5052 plate motor-front-spacer is cut from
    # Not something this package asks anybody to supply: it is the piece the
    # part above is cut out of, declared so that the cut can be checked. What
    # a shop actually buys is a sheet with several of these nested on it.
    manufacturable: false
    parameters:
      step:
        type: string
        default: Metal_Parts/02_Motor_Front_Spacer.step
      margin: 5.0
    properties:
      material: //pub/robotics/rebot/devarm:aluminium-5052

  motor-front-spacer:
    type: step
    path: Metal_Parts/02_Motor_Front_Spacer.step
    desc: Motor 2-5 front spacer (x4) - can be printed in ABS at 30% infill
    # Where it bolts to the motor, measured off this file: the six M3 clearance
    # holes (r=1.6) on a 13.5 circle open onto the z=-56.5 face, and the part
    # extends from there towards +Z. See //pub/robotics/rebot/devarm/third_party.
    implements:
      //pub/robotics/rebot/devarm/third_party:actuator/dm43xx-mounted:
        motor: [[0, 0, -56.5], [0, 0, 1], 0]
    manufacturing:
      method: subtractive
      source: motor-front-spacer-blank
      cnc:
        operation: profile
        diameter: 2 mm
        toolAxis: +Z
      desc: Anodized or sandblasted, H7 or interference fit on mating features
    tolerance: 0.02
    properties:
      material: //pub/robotics/rebot/devarm:aluminium-5052

  motor-back-spacer-blank:
    type: build123d
    path: src/stock_plate.py
    desc: The 5052 plate motor-back-spacer is cut from
    # Not something this package asks anybody to supply: it is the piece the
    # part above is cut out of, declared so that the cut can be checked. What
    # a shop actually buys is a sheet with several of these nested on it.
    manufacturable: false
    parameters:
      step:
        type: string
        default: Metal_Parts/02_Motor_Back_Spacer.step
      margin: 5.0
    properties:
      material: //pub/robotics/rebot/devarm:aluminium-5052

  motor-back-spacer:
    type: step
    path: Metal_Parts/02_Motor_Back_Spacer.step
    desc: Motor 2-4 rear spacer (x3)
    manufacturing:
      method: subtractive
      source: motor-back-spacer-blank
      cnc:
        operation: profile
        diameter: 2 mm
        toolAxis: -X
      desc: Anodized or sandblasted, H7 or interference fit on mating features
    tolerance: 0.02
    properties:
      material: //pub/robotics/rebot/devarm:aluminium-5052

  flange-blank:
    type: build123d
    path: src/stock_plate.py
    desc: The 5052 plate flange is cut from
    # Not something this package asks anybody to supply: it is the piece the
    # part above is cut out of, declared so that the cut can be checked. What
    # a shop actually buys is a sheet with several of these nested on it.
    manufacturable: false
    parameters:
      step:
        type: string
        default: Metal_Parts/02_FLANGE.step
      margin: 5.0
    properties:
      material: //pub/robotics/rebot/devarm:aluminium-5052

  flange:
    type: step
    path: Metal_Parts/02_FLANGE.step
    desc: Motor 2-4 rear flange (x3)
    # This part carries the same six-hole pattern as the front spacer - r=1.35 on
    # the 13.5 circle around (y, z) = (-20, -93), opening onto x=21.625 with the
    # part behind them towards -X - and it used to declare that pattern as
    # 'actuator/dm43xx-mounted', on the reading that a part with the motor's bolt
    # circle on it bolts to the motor.
    #
    # The released assembly says otherwise, and this is what removed the
    # declaration. Working backwards from where the release puts each flange and
    # each actuator, the motor-side frame this pattern would have to meet comes
    # out 10.6 mm clear of the actuator model's own end face - repeatably, the same
    # number for two flanges on two different DM4340Ps - where the front spacer's
    # comes out exactly on it. So the flange does not sit on the actuator: it is
    # the *rear* flange, as its own description says, and something 10.6 mm thick
    # is between the two. Until that something is identified, the pattern is
    # measured and the interface it belongs to is not this one.
    manufacturing:
      method: subtractive
      source: flange-blank
      cnc:
        operation: profile
        diameter: 2 mm
        toolAxis: +X
      desc: Anodized or sandblasted, H7 or interference fit on mating features
    tolerance: 0.02
    properties:
      material: //pub/robotics/rebot/devarm:aluminium-5052

  wrist-bracket-blank:
    type: build123d

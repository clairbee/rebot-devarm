  ##############################################################################
  # CNC machined metal parts
  #
  # Machining specification (readme.md): key dimension tolerance +/-0.02 mm
  # (GB/T1840-M), anodized or sandblasted finish, H7 / interference fit on
  # mating features.
  #
  # The tolerance and the finish are the manufacturing request and belong in a
  # manufacturing section; PartCAD has no field for either on a 'step' part, so
  # they are carried in 'requirements' where a human or an LLM can still read
  # them. 'pc test' fails these parts for exactly that reason. See PARTCAD.md.
  #
  # Links 1, 2, 3 and 5 are "CNC + sheet metal" in the readme: two methods, one
  # after the other. 'manufacturing.method' takes a single value, so they are
  # declared 'subtractive' with a note on each.
  ##############################################################################
  cnc/base-reinforcement:
    type: step
    path: Metal_Parts/02_Base_Reinforcement_Part.step

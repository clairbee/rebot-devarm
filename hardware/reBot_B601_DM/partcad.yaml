    source: //pub/std/metric/cqwarehouse:fastener/countersunk-iso10642
    desc: M3x12 countersunk head screw (x30+)
    with:
      size: M3-0.5
      length: 12

  purchased/screw-km3-16:
    type: enrich
    source: //pub/std/metric/cqwarehouse:fastener/countersunk-iso10642
    desc: M3x16 countersunk head screw (x34+)

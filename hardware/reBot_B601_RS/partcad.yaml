  ##############################################################################
  # Shared with the DM arm
  #
  # These are not "similar to" the DM arm's parts: they are the same solids. The
  # vendor publishes a copy of each in both releases under its own file name, and
  # the two copies agree vertex for vertex once aligned - which is how they were
  # found, by comparing every STEP file of one arm against every STEP file of the
  # other (see ../../PARTCAD.md, "What the two arms share").
  #
  # So each is declared once, in the DM package, and aliased here: one part, one
  # blank, one route, one line in a shop's quote for both arms - and a difference
  # that shows up in a future release is a difference somebody has to look at
  # rather than two files quietly drifting apart.
  #
  # The RS release's own copies are still in ./Metal_Parts and
  # ./3D_Printed_Parts; the file each alias stands in for is named beside it.
  ##############################################################################
  rail-bracket:
    type: alias
    source: //pub/robotics/rebot/devarm/b601-dm:rail-bracket
    desc: "Gripper slider support bracket (x1) - RS copy: 1-RAIL-BASE-2.step"

  motor-back-spacer:
    type: alias
    source: //pub/robotics/rebot/devarm/b601-dm:motor-back-spacer
    desc: "Motor 4 back cable spacer (x1) - RS copy: 2-Motor_Back_Spacer.step"

  rack:
    type: alias
    source: //pub/robotics/rebot/devarm/b601-dm:rack
    desc: "Rack (x2) - RS copy: 2-RACK-1M.step"

  slider-bracket:
    type: alias
    source: //pub/robotics/rebot/devarm/b601-dm:slider-bracket
    desc: "Gripper slider metal bracket (x1) - RS copy: 2-RAIL-BASE-1.step"

  slider-extension:
    type: alias
    source: //pub/robotics/rebot/devarm/b601-dm:slider-extension
    desc: "Slider to gripper extension (x2) - RS copy: 2-SLIDER-FIX.step"

  gripper-connector-a:
    type: alias
    source: //pub/robotics/rebot/devarm/b601-dm:gripper-connector-a
    desc: "Gripper connector A (x1) - RS copy: 2-M6-ROTOR.step"

  # The seventh, and the answer to a question README.md left open: it lists
  # "2-M7-STATOR.step" for gripper connector B, and this repository has no such
  # file. It has 2-M7-ROTOR.step, which is the DM arm's gear connector, vertex
  # for vertex. So that is what this part is.
  gear-connector:
    type: alias
    source: //pub/robotics/rebot/devarm/b601-dm:gear-connector
    desc: "The boss the gripper pinion sits on (x1) - RS copy: 2-M7-ROTOR.step, which README.md calls 2-M7-STATOR.step and lists as \"gripper connector B\""


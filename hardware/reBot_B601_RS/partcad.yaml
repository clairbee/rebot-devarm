    desc: Joint metal disc (x3) - conceals the screws
    manufacturing:
      method: subtractive
      parameters:
        finish: anodized or sandblasted
        fit: H7 or interference on mating features
    tolerance: 0.02
    properties:
      material: //pub/robotics/rebot/devarm:aluminium-5052
  cnc/rs06-front-extension:
    type: step
    path: Metal_Parts/2-RSM2-STATOR-1.step
    desc: RS06 front extension (x2)
    manufacturing:
      method: subtractive
      parameters:
        finish: anodized or sandblasted
        fit: H7 or interference on mating features
    tolerance: 0.02
    properties:

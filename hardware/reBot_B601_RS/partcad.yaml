  ##############################################################################
  # Purchased parts - the vendor publishes no CAD model
  #
  # Envelopes from //pub/robotics/rebot/devarm/third_party, aliased here under the
  # names the readme uses. See ../reBot_B601_DM/partcad.yaml for the same block on
  # the DM side, and each envelope's 'summary' for what it is not.
  ##############################################################################
  # NOTE: no 'vendor'/'sku' here. An alias reads them from the part it points at,
  # which is where they are declared; declaring them on the alias itself has no
  # effect at all (a PartCAD bug - see PARTCAD.md), so writing them twice would
  # only be a second copy to keep in step.
  purchased/actuator-rs00:
    type: alias
    source: //pub/robotics/rebot/devarm/third_party:actuator/rs00
    desc: Brushless actuator RobStride RS00 (x4)

  purchased/actuator-rs06:
    type: alias
    source: //pub/robotics/rebot/devarm/third_party:actuator/rs06
    desc: Brushless actuator RobStride RS06 (x3)

  purchased/bearing-6803zz:
    type: alias

# Every part of the reBot Arm B601 RS (RobStride RS00/RS06 actuators).
#
# Same conventions as the DM variant - see ../reBot_B601_DM/partcad.yaml and
# ../../PARTCAD.md. ./README.md is generated from this file, and so are ./arm.md
# and ./power-supply.md; quantities live in ./arm.assy, and the "(xN)" suffix in
# each 'desc' keeps the readme quantity until the assemblies carry real
# placements.
#
# Seven of this arm's parts are the DM arm's parts: the same geometry, published
# by the vendor under a different file name. Each of those is an alias of the DM
# declaration rather than a second copy of it - see the "Shared with the DM arm"
# section below.

desc: reBot Arm B601 RS - RobStride RS00/RS06 actuators
url: https://github.com/clairbee/rebot-devarm/tree/main/hardware/reBot_B601_RS
manufacturable: true

# What ./README.md says above the generated parts list. The folder is a PartCAD
# package, so its readme is generated from this file; the two longest sections of
# the vendor's document - what to buy and how the power supply goes together -
# are documents of their own under ./doc/ and linked from here.
docs:
  name: "\U0001F916 reBot Arm B601 RS - Open Source Hardware Specification"
  intro: |

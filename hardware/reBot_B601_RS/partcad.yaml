  purchased/psu-lrs-600-48:
    type: alias
    source: //pub/robotics/rebot/devarm/third_party:psu/lrs-600-48
    desc: Power supply MeanWell LRS-600-48, 48V 12.5A (x1)

  purchased/connector-xt60e:
    type: alias
    source: //pub/robotics/rebot/devarm/third_party:connector/xt60e-female
    desc: Output port XT60E female + lug pigtail (x1)

  # Still without a shape, and so still out of the BOM:
  #
  #   Gear                     module 1, boss type, 16 teeth, 6 mm bore    x1
  #   Screw                    KA3*12mm self-tapping                       x48+
  #   Hex nut                  M3x2.5                                      x2
  #   CAN-USB driver board                                                 x1
  #   XT30 2+2 power separation board                                      x1
  #   3-in-1 IEC inlet socket  quick-connect, red switch, dual nuts        x1
  #   Power cord               US standard AC cable                        x1
  #   Power AC wiring          1.5mm^2 red/blue/yellow, 10cm               x3
  #   Adapter cable            XT30U female to XT60 male                   x1
  #
  # The XT30 2+2 harnesses (320 mm x1+, 200 mm x4+, 300 mm x1+, straight x1+) are
  # assemblies rather than parts - see 'cable/xt30-2x2-350' in the third_party
  # package for the pattern.
  ##############################################################################

# What the shop cuts these plates on, once, for every part that declares a
# 'cam:' section of its own. The numbers are a 3-axis router in 5052 aluminium
# with flood coolant: conservative feeds, a shallow pass, and climb milling for
# the edge finish the readme's anodized parts need. A part that needs something
# else says so for itself.
#
# 'pc cam' writes the route of every such part; 'pc test' runs the same code as
# its 'cam' check and fails a part whose section cannot produce one. That is what
# makes the "subtractive" method above a claim somebody checked rather than a
# label: a tool that will not fit the inside corners of a part is a route that
# does not come out.
  ##############################################################################
  # The machined plates, as jobs on a machine
  #
  # A 2.5D route is cut down Z, so a plate has to lie flat in XY for one to mean
  # anything - and these plates are drawn in the orientation they have in the
  # arm, which is not that. Each entry below is the same part turned flat: an
  # alias with the 'offset' that lays it down and the 'cam:' section that says
  # how it is cut. The parts themselves keep the orientation the assembly needs.
  #
  # Each is a second declaration of the same STEP file rather than an alias of
  # the part: a 'cam:' section on an alias is dropped, so an alias cannot be
  # "the same part as a job on a machine". See ../../PARTCAD.md.
  #
  # Which way *up* matters as much as flat: a route follows the section at the
  # bottom of the cut, so the face carrying the pockets points at the spindle and
  # the widest section goes down. Laid the other way up the route follows the
  # pocket floor and cuts the part in half.
  #
  # Only four of this variant's machined parts are here, and the absences are
  # the point. This arm's metal is mostly *not* plate: 2-CD is a 40 mm disc on a
  # 4.6 mm2 section (a turned part), 2-RSM3-ROTATOR-L/R are 92 mm long on a
  # 20 mm2 section (bar, not sheet), 2-RSM1-ROTOR-1 is 74 mm tall, and
  # 2-RSM-ROTOR-L/R are 15-19 mm blocks whose two faces differ by two orders of
  # magnitude. A 2.5D outline cut is not what makes any of those, so none of
  # them claims a route rather than claiming a wrong one - they are still
  # 'method: subtractive' parts above, and what PartCAD has no way to say about
  # them is in ../../PARTCAD.md.
  #
  # 'pc cam -p' writes the routes; 'pc test' fails any of these whose section
  # cannot produce one, which is what makes 'method: subtractive' on the part a
  # claim somebody checked. The cutter is 2 mm because the M3 clearance holes are
  # 3.2 mm and a profile cut goes around the inside of every hole.
  ##############################################################################
  cam/motor-back-spacer:
    type: step
    path: Metal_Parts/2-Motor_Back_Spacer.step
    desc: Motor 4 back cable spacer, laid flat for the machine
    offset: [[0, 0, 0], [0, 1, 0], -90]
    tolerance: 0.02
    cam:
      operation: profile
      tool: 2 mm

  cam/gripper-connector-a:
    type: step
    path: Metal_Parts/2-M6-ROTOR.step
    desc: Gripper connector A, laid flat for the machine
    offset: [[0, 0, 0], [1, 0, 0], -90]
    tolerance: 0.02
    cam:
      operation: profile
      tool: 2 mm

  cam/slider-bracket:
    type: step
    path: Metal_Parts/2-RAIL-BASE-1.step
    desc: Gripper slider metal bracket, laid flat for the machine
    offset: [[0, 0, 0], [1, 0, 0], -90]
    tolerance: 0.02
    cam:
      operation: profile
      tool: 2 mm

  cam/rack:
    type: step
    path: Metal_Parts/2-RACK-1M.step
    desc: Rack, laid flat for the machine
    offset: [[0, 0, 0], [1, 0, 0], 90]
    tolerance: 0.02
    cam:
      operation: profile
      tool: 2 mm

# A projection of every object, next to the package. The generated bills of
# materials show each line's picture from these, which is the column a reader of
# a parts list looks at first; SVG so that a diff is a diff and the files stay
# small.
render:
  svg:
    prefix: doc/

cam:
  gcode:
    feed: 900 mm/min
    plunge: 250 mm/min
    depth_per_pass: 0.8 mm
    safe_z: 5 mm
    speed: 12000 rpm
    direction: climb

assemblies:
  arm:
    type: assy
    desc: reBot Arm B601 RS (structure only so far - see ../../PARTCAD.md)
    manufacturable: true
    # The bill of materials as markdown, so a change to it is a diff.
    render:
      readme:

  power-supply:
    type: assy
    desc: Power supply enclosure, assembled per README.md "Power Supply Assembly"
    manufacturable: true
    # The bill of materials as markdown, so a change to it is a diff.
    render:
      readme:

  # The released full-arm STEP file, read as an assembly - see the DM package.
  reference/arm-v1.0:
    type: step
    path: reBot_B601_RS_v1.0_20260625.step
    desc: Full arm assembly as released on 2026-06-25 (reference)
    manufacturable: false

# Bill of materials of the reBot Arm B601 RS (RobStride RS00/RS06 actuators).
#
# Same conventions as the DM variant - see ../reBot_B601_DM/partcad.yaml and
# ../../PARTCAD.md. Every entry below is one line of the BOM tables in
# ./README.md; quantities live in ./arm.assy, and the "(xN)" suffix in each
# 'desc' preserves the readme quantity until the assembly is complete.

desc: reBot Arm B601 RS - RobStride RS00/RS06 actuators
url: https://github.com/clairbee/rebot-devarm/tree/main/hardware/reBot_B601_RS
manufacturable: true

parts:
  ##############################################################################
  # 3D printed parts
  ##############################################################################
  printed/base-plate:
    type: step
    path: 3D_Printed_Parts/1-BASE-PLATE.step
    desc: Robotic arm base platform (x1)
    manufacturing:
      method: additive
      parameters:
        nozzle: 0.4 mm
        layer height: 0.2 mm
        infill: 30%
    tolerance: 0.2
    properties:
      material: //pub/std/manufacturing/material/plastic:abs
      color: "#1A1A1A"

  printed/base-link:
    type: step
    path: 3D_Printed_Parts/1-RSM1-STATOR-1.step
    desc: Robotic arm base link (x1)
    manufacturing:
      method: additive
      parameters:
        nozzle: 0.4 mm
        layer height: 0.2 mm
        infill: 30%
    tolerance: 0.2
    properties:
      material: //pub/std/manufacturing/material/plastic:abs
      color: "#1A1A1A"

  printed/upper-arm-filler-l:
    type: step
    path: 3D_Printed_Parts/1-DOWN-DL.step
    desc: Upper arm left filler (x1)
    manufacturing:
      method: additive
      parameters:
        nozzle: 0.4 mm
        layer height: 0.2 mm
        infill: 15%
    tolerance: 0.2
    properties:
      material: //pub/std/manufacturing/material/plastic:pla

  printed/upper-arm-filler-r:
    type: step
    path: 3D_Printed_Parts/1-DOWN-DR.step
    desc: Upper arm right filler (x1)
    manufacturing:
      method: additive
      parameters:
        nozzle: 0.4 mm
        layer height: 0.2 mm
        infill: 15%
    tolerance: 0.2
    properties:
      material: //pub/std/manufacturing/material/plastic:pla

  printed/arm-filler-m:
    type: step
    path: 3D_Printed_Parts/1-SPACE-UP.step
    desc: Upper and lower arm center filler (x2)
    manufacturing:
      method: additive
      parameters:
        nozzle: 0.4 mm
        layer height: 0.2 mm
        infill: 30%
    tolerance: 0.2
    properties:
      material: //pub/std/manufacturing/material/plastic:abs
      color: "#1A1A1A"

  printed/arm-handle:
    type: step
    path: 3D_Printed_Parts/1-HANDLE.step
    desc: Arm handle (x1)
    manufacturing:
      method: additive
      parameters:
        nozzle: 0.4 mm
        layer height: 0.2 mm
        infill: 30%
    tolerance: 0.2
    properties:
      material: //pub/std/manufacturing/material/plastic:abs
      color: "#1A1A1A"

  printed/arm-cover:
    type: step
    path: 3D_Printed_Parts/1-COVER.step
    desc: Upper and lower arm cover (x2)
    manufacturing:
      method: additive
      parameters:
        nozzle: 0.4 mm
        layer height: 0.2 mm
        infill: 15%
    tolerance: 0.2
    properties:
      material: //pub/std/manufacturing/material/plastic:pla
      color: "#2E7D32"

  printed/lower-arm-filler-l:
    type: step
    path: 3D_Printed_Parts/1-UP-DL.step
    desc: Lower arm left filler (x1)
    manufacturing:
      method: additive
      parameters:
        nozzle: 0.4 mm
        layer height: 0.2 mm
        infill: 15%
    tolerance: 0.2
    properties:
      material: //pub/std/manufacturing/material/plastic:pla

  printed/lower-arm-filler-r:
    type: step
    path: 3D_Printed_Parts/1-UP-DR.step
    desc: Lower arm right filler (x1)
    manufacturing:
      method: additive
      parameters:
        nozzle: 0.4 mm
        layer height: 0.2 mm
        infill: 15%
    tolerance: 0.2
    properties:
      material: //pub/std/manufacturing/material/plastic:pla

  printed/gripper-limit:
    type: step
    path: 3D_Printed_Parts/1-STOPPER-1.step
    desc: Gripper horizontal limit (x1)
    manufacturing:
      method: additive
      parameters:
        nozzle: 0.4 mm
        layer height: 0.2 mm
        infill: 15%
    tolerance: 0.2
    properties:
      material: //pub/std/manufacturing/material/plastic:pla
      color: "#2E7D32"

  printed/rail-bracket:
    type: step
    path: 3D_Printed_Parts/1-RAIL-BASE-2.step
    desc: Gripper slider support bracket (x1)
    manufacturing:
      method: additive
      parameters:
        nozzle: 0.4 mm
        layer height: 0.2 mm
        infill: 15%
    tolerance: 0.2
    properties:
      material: //pub/std/manufacturing/material/plastic:pla
      color: "#2E7D32"

  printed/finger:
    type: step
    path: 3D_Printed_Parts/1-CLIP.step
    desc: Gripper finger (x2) - print from the side of the gripper for strength
    manufacturing:
      method: additive
      parameters:
        nozzle: 0.4 mm
        layer height: 0.2 mm
        infill: 45%
    tolerance: 0.2
    properties:
      material: //pub/std/manufacturing/material/plastic:abs
      color: "#1A1A1A"

  printed/motor1-harness-clip:
    type: step
    path: 3D_Printed_Parts/RS_Motor1_wiring_harness_clip.stp
    desc: Wiring harness clip for the two sides of motor 1 (x2, optional but recommended)
    manufacturing:
      method: additive
      parameters:
        nozzle: 0.4 mm
        layer height: 0.2 mm
        infill: 30%
    tolerance: 0.2
    properties:
      material: //pub/std/manufacturing/material/plastic:abs
      color: "#1A1A1A"

  # Power supply enclosure
  printed/psu-front-cover:
    type: step
    path: 3D_Printed_Parts/RS-power-Top Cover.stp
    desc: Power supply front shell (x1)
    manufacturing:
      method: additive
      parameters:
        nozzle: 0.4 mm
        layer height: 0.2 mm
        infill: 30%
    tolerance: 0.2
    properties:
      material: //pub/std/manufacturing/material/plastic:pla

  printed/psu-rear-cover:
    type: step
    path: 3D_Printed_Parts/RS-power-Bottom Cover.stp
    desc: Power supply rear shell (x1)
    manufacturing:
      method: additive
      parameters:
        nozzle: 0.4 mm
        layer height: 0.2 mm
        infill: 30%
    tolerance: 0.2
    properties:
      material: //pub/std/manufacturing/material/plastic:pla

  printed/psu-front-cover-slider:
    type: step
    path: 3D_Printed_Parts/RS-power-Top Cover-Sliding Cover.stp
    desc: Power supply front shell sliding cover (x1)
    manufacturing:
      method: additive
      parameters:
        nozzle: 0.4 mm
        layer height: 0.2 mm
        infill: 30%
    tolerance: 0.2
    properties:
      material: //pub/std/manufacturing/material/plastic:pla

  ##############################################################################
  # CNC machined metal parts
  #
  # Machining specification (README.md): key dimension tolerance +/-0.02 mm
  # (GB/T1840-M), anodized or sandblasted finish, H7 / interference fit.
  #
  # The tolerance is the 'tolerance:' field and the finish and the fit are
  # 'manufacturing.parameters'; the alloy is catalogued in ../../partcad.yaml.
  # See ../reBot_B601_DM/partcad.yaml and PARTCAD.md.
  ##############################################################################
  cnc/motor1-bearing-mount:
    type: step
    path: Metal_Parts/2-RSM1-ROTOR-1.step
    # NOTE: README.md lists this same file twice, as "Motor 1 Bearing Mount"
    # (x1) and as "Link1 Bottom Metal" (x3). One of the two rows is wrong.
    desc: Motor 1 bearing mount (x1) - see note about the duplicated readme row
    manufacturing:
      method: subtractive
      parameters:
        finish: anodized or sandblasted
        fit: H7 or interference on mating features
    tolerance: 0.02
    properties:
      material: //pub/robotics/rebot/devarm:aluminium-5052

  cnc/link1-metal-l:
    type: step
    path: Metal_Parts/2-RSM-ROTOR-L.step
    desc: Link 1 left metal (x1)
    manufacturing:
      method: subtractive
      parameters:
        finish: anodized or sandblasted
        fit: H7 or interference on mating features
    tolerance: 0.02
    properties:
      material: //pub/robotics/rebot/devarm:aluminium-5052

  cnc/link1-metal-r:

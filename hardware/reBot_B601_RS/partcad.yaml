        finish: anodized or sandblasted
        fit: H7 or interference on mating features
    tolerance: 0.02
    properties:
      material: //pub/robotics/rebot/devarm:aluminium-5052

  cnc/motor-cable-clip:
    type: step
    path: Metal_Parts/1-O-CLIP.step
    desc: Motor 4-7 cable fixing (x4) - can be printed in ABS with M2 nuts instead
    manufacturing:
      method: subtractive
      parameters:
        finish: anodized or sandblasted
        fit: H7 or interference on mating features
    tolerance: 0.02

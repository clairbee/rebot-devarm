# PartCAD package for the reBot DevArm open hardware project.
#
# This file is the entry point of the digital thread for the robot: it declares
# the packages that hold the bill of materials (BOM) of each arm variant and the
# assemblies that carry the manufacturing/assembly instructions.
#
# See ./PARTCAD.md for the current status, the conventions used here and the
# work that still has to be done.

# The package path this package expects to be published at. It is not in the
# public index yet, which no longer stops the commands from working: a declared
# name that the index does not know is honoured as of PartCAD 0.8.x. Registering
# it in https://github.com/partcad/partcad-index is what makes the arm findable
# by that path for everybody else.
name: //pub/robotics/rebot/devarm
desc: reBot DevArm - open source 7-DoF robotic arm for developers
url: https://github.com/clairbee/rebot-devarm
partcad: ">=0.8.124"

# The parts declared here are meant to be manufactured or purchased, not just
# viewed. This makes the package visible to 'pc supply quote' and friends.
manufacturable: true

docs:
  intro: |
    reBot DevArm is an open source robotic arm published under CERN-OHL-W-2.0
    (hardware) and Apache-2.0 (software). Two variants are maintained:

      * B601 DM - Damiao DM43xx actuators
      * B601 RS - RobStride RS00/RS06 actuators

    Each variant is a separate PartCAD package holding its own BOM (parts) and
    its own assembly instructions (assemblies).
  usage: |
    ```shell
    pc --no-ansi install                # fetch what the packages depend on
    pc --no-ansi list packages          # the variants
    pc --no-ansi list parts -r          # every part of every variant
    pc --no-ansi bom -P //pub/robotics/rebot/devarm/b601-dm arm
    pc --no-ansi render -t pdf -a power-supply -P //pub/robotics/rebot/devarm/b601-dm
    pc --no-ansi inspect -a //pub/robotics/rebot/devarm/b601-dm:arm
    ```

# The materials this robot is made of, for the ones no public catalogue
# publishes yet. '//pub/std/manufacturing/material/plastic' has PLA, ABS and
# nylon, which the printed parts and the connector housings name there; metals
# and silicone are catalogued here so that a part can name an object rather than
# repeat a string, and so that a density turns a volume into a mass.
#
# Densities are g/mm^3, which is what PartCAD reads: a datasheet's g/cm^3
# divided by 1000.
##############################################################################
# Who supplies this arm
#
# Two providers, because the arm is made two ways. The bought parts are a
# catalogue with prices, which is a store; the printed and machined parts are a
# capability, which is a manufacturer. Both are declared here rather than in the
# two variant packages, because both arms buy from the same places and are made
# by the same kind of shop.
#
# What they are for, beyond 'pc supply quote': 'pc test' asks of every part that
# is meant to be made or bought whether anybody can supply it, and until these
# existed the answer for every one of them was "No suppliers found". That is the
# check doing its job - a parts list nobody can act on is not a parts list - and
# it is answered by saying who supplies what, not by turning the check off.
##############################################################################
providers:
  # The reference prices the readmes publish, as a price list.
  reference-prices:
    type: enrich
    source: csv-price-list
    with:
      currency: USD
      file: providers/price_list.csv

  csv-price-list:
    type: store
    path: providers/price_list.py
    abstract: true
    parameters:
      file:
        type: string
        default: providers/price_list.csv
      currency:
        type: string
        default: USD

  # A printer and a machine shop, as a statement of what they can make. It
  # quotes nothing: see providers/workshop.py.
  workshop:
    type: manufacturer
    path: providers/workshop.py

# Both of them, for every part of both arms.
suppliers:
  reference-prices:
  workshop:

materials:
  aluminium-5052:
    formal: AL 5052
    full: Aluminium alloy 5052 (AlMg2.5)
    desc: |
      The alloy every machined part of both arms is cut from. Non-heat-treatable,
      good corrosion resistance, and the one the readmes name for CNC work with
      an anodized or sandblasted finish.
    url: https://en.wikipedia.org/wiki/5052_aluminium_alloy
    density: 0.00268
    tags:
      - corrosion-resistant
      - weldable
      - anodizable

  stainless-304:
    formal: SS 304
    full: Stainless steel 304 (A2)
    desc: The steel the power supply enclosure's screws and nuts are made of.
    url: https://en.wikipedia.org/wiki/SAE_304_stainless_steel
    density: 0.0079
    tags:
      - corrosion-resistant

  chrome-steel-52100:
    formal: AISI 52100
    full: Chrome steel AISI 52100 (100Cr6)
    desc: Bearing steel - the rings and the rollers of every bearing in the arm.
    url: https://en.wikipedia.org/wiki/52100_steel
    density: 0.00781
    tags:
      - hardened
      - bearing

  silicone:
    full: Silicone rubber
    desc: The anti-slip pad under the base, and the insulation of the wiring.
    url: https://en.wikipedia.org/wiki/Silicone_rubber
    density: 0.0012
    tags:
      - elastomer
      - heat-resistant

  steel-galvanized:
    full: Galvanized steel
    desc: The case of the MeanWell power supplies.
    density: 0.00785
    tags:
      - corrosion-resistant

dependencies:
  # The public PartCAD index. It provides '//pub/std/metric/cqwarehouse', which
  # is where the standard fasteners of the BOM come from.
  pub:
    onlyInRoot: true
    type: git
    url: https://github.com/partcad/partcad-index.git

  third_party:
    desc: Envelope shapes for the parts the arm buys rather than makes
    type: local
    path: ./third_party

  b601-dm:
    desc: reBot Arm B601 DM (Damiao actuators)
    type: local
    path: ./hardware/reBot_B601_DM

  b601-rs:
    desc: reBot Arm B601 RS (RobStride actuators)
    type: local
    path: ./hardware/reBot_B601_RS
